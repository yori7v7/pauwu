name: Publicar carta en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar únicamente los archivos de la página
        shell: bash
        run: |
          mkdir _site
          cp index.html styles.css script.js memory-gallery.js .nojekyll _site/
          cp -- *.jpeg *.mp4 _site/
          cp -- *.mp3 _site/
          cp -R assets _site/
      - name: Guardar la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
